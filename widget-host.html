<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Lattice Widget</title>
    <style>
      /*
       * 桌面窗口里的"卡片"由这一页负责画：背景、描边。
       * 组件只管内容，跟画布里 .lattice-widget 的分工一致。
       *
       * 圆角不用 border-radius —— 窗口不是逐像素透明的，
       * border-radius 只会把方角变成"白角"。真正的圆角由 Rust 侧
       * 用 SetWindowRgn 把窗口裁成圆角矩形，所以这里必须画满整块矩形，
       * 形状交给裁剪决定。
       */
      html body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* 用 surface 而不是 bg：卡片是浮在桌面上的，比底色亮一档更像一块玻璃。
           选择器写成 html body 是为了压过平台样式里的 body 规则。
           开了底板外观之后这个值由脚本改写（= 底色盖在壁纸上的合成色），
           它只在壁纸层还没到位时露个脸 */
        background: var(--lattice-surface, #1d1d21);
      }

      /*
       * 裁剪边缘有 1px 抗锯齿落差，用内描边压一下，看起来更像一块玻璃。
       *
       * 描边画在 ::after 上而不是 body 自己身上：底板是"壁纸 + 底色"两层，
       * body 的 inset 阴影会被它们盖住（阴影画在背景之上、内容之下），
       * 只有压到最上面才始终看得见 —— 而这条描边的强度还要跟着底板明暗变。
       */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px var(--lattice-border, rgb(255 255 255 / 10%));
      }

      /*
       * `shape: region` 的窗口（桌宠）：这里没有卡片。
       *
       * 背景必须透明 —— 窗口区域由组件上报，区域外的像素根本不存在，
       * 但只要窗口还有一块底色，"还没上报"那几百毫秒就会闪一块色块。
       * 描边同理：它画在整块窗口的内沿，而内沿在宠物身上是不存在的。
       */
      html[data-shape="region"] body {
        background: transparent;
      }

      html[data-shape="region"] body::after {
        display: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/widgetHost.ts"></script>
  </body>
</html>
