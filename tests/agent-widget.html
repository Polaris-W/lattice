<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>agent widget test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <!--
      直接加载组件那一份 widget.js，不用 iframe。

      以前这里是 `<iframe src="/widgets/lattice.agent/index.html">` + 顶层 await 等
      `load`，跑出来是 **0 条断言**（`npm run test:browser` 报"一条断言都没跑完"）。
      原因是两条时钟在赛跑：`--virtual-time-budget` 让虚拟时钟一路快进到 9 秒，
      而 iframe 的 `load` 走的是**真实网络** —— 谁先到看运气，快进赢了就 dump 到
      一个空的 `<pre>`。这类页面的症状和"没有断言"完全一样，所以别再用 iframe。

      widget.js 把 `__latticeAgentFeed` 挂在**同步执行的那一段**（在任何 await 之前），
      所以普通 `<script>` 加载完就能直接断言，一个等待都不需要。
    -->
    <script src="/widgets/lattice.agent/widget.js"></script>
    <script>
      /*
       * `lattice.agent` 板子的纯逻辑。
       *
       * 测的是"一条审计记录该怎么显示"，不测渲染 —— 渲染出问题眼睛能看见，
       * 而这几个判断出问题，看到的是"板子莫名其妙少了一行"。
       *
       * 三个最要紧的：
       *   1. 读操作（state / health / raw）必须被滤掉，否则 agent 看一眼桌面
       *      就把真正改动的那一条冲下去了
       *   2. 新的在前
       *   3. 动作名换成动词短语，换不到的显示原名（不能整行消失）
       */
      (function () {
        var lines = [];
        function log(pass, text) {
          lines.push((pass ? "PASS " : "FAIL ") + text);
        }
        function eq(actual, expected, text) {
          log(JSON.stringify(actual) === JSON.stringify(expected), text + "（得到 " + JSON.stringify(actual) + "）");
        }
        function flush() {
          document.getElementById("out").innerHTML = lines
            .map(function (line) {
              return '<span class="' + (line.indexOf("PASS") === 0 ? "ok" : "bad") + '">' + line + "</span>";
            })
            .join("\n");
          window.__done = true;
        }

        var api = window.__latticeAgentFeed;
        log(Boolean(api), "组件把纯逻辑挂到了 window.__latticeAgentFeed 上");
        if (!api) {
          // 组件没加载起来就到此为止：继续往下走只会在解构那里抛异常，
          // 页面又变成 0 条断言，看不出是哪一步坏的
          flush();
          return;
        }
        var describe = api.describe;
        var formatFeed = api.formatFeed;
        var timeOf = api.timeOf;

        var AT = new Date(2026, 9, 24, 9, 5, 3).getTime();

        // ---- 1. 一条 say ----

        var said = describe({ at: AT, op: "say", detail: "Moved the clock to the top right" });
        eq(said.kind, "say", "say 的类型是 say");
        eq(said.text, "Moved the clock to the top right", "正文原样，不做加工");
        eq(said.time, "09:05:03", "时间是本地时分秒");
        eq(said.action, undefined, "say 没有动作名");

        eq(describe({ at: AT, op: "say", detail: "" }), null, "空正文的 say 丢掉");
        eq(describe({ at: AT, op: "say" }), null, "没有 detail 的 say 丢掉");

        // ---- 2. 一条 act ----

        var moved = describe({ at: AT, op: "act", detail: "placement.move", status: 200 });
        eq(moved.kind, "act", "act 的类型是 act");
        eq(moved.text, "moved a widget", "动作名换成动词短语");
        eq(moved.action, "placement.move", "原始动作名留着（排错要看它）");

        eq(
          describe({ op: "act", detail: "placement.explode" }).text,
          "placement.explode",
          "没见过的动作显示原名，不整行消失",
        );

        var verbs = [
          ["placement.add", "added a widget"],
          ["placement.resize", "resized a widget"],
          ["placement.remove", "removed a widget"],
          ["placement.pin", "pinned a widget"],
          ["placement.front", "brought a widget forward"],
          ["theme.set", "changed the theme"],
          ["widgets.pause", "paused or resumed the widgets"],
        ];
        for (var index = 0; index < verbs.length; index += 1) {
          eq(describe({ op: "act", detail: verbs[index][0] }).text, verbs[index][1], verbs[index][0] + " 有对应的说法");
        }

        // ---- 3. 读操作必须被滤掉 ----

        var reads = ["state", "health", "raw", "tool", "explode"];
        for (var readIndex = 0; readIndex < reads.length; readIndex += 1) {
          eq(describe({ at: AT, op: reads[readIndex], detail: "anything" }), null, reads[readIndex] + " 不是\"说了什么/改了什么\"，不显示");
        }
        eq(describe(null), null, "null 记录跳过");
        eq(describe({}), null, "空对象跳过");
        eq(describe({ at: AT }), null, "没有 op 的跳过");

        // ---- 4. 时间 ----

        eq(timeOf(AT), "09:05:03", "毫秒时间戳转本地时分秒");
        eq(/^\d{2}:\d{2}:\d{2}$/.test(timeOf(0)), true, "纪元 0 也能格式化（不崩）");
        eq(timeOf(NaN), "", "NaN 给空串，不是 Invalid Date");
        eq(timeOf("1700000000000"), "", "字符串时间戳不认");
        eq(timeOf(undefined), "", "没有时间就给空串");
        eq(describe({ op: "say", detail: "hi" }).time, "", "缺 at 时 time 是空串，行照样显示");

        // ---- 5. formatFeed ----

        eq(formatFeed(null, 10, true), { enabled: false, rows: [] }, "null 载荷 → 空");
        eq(formatFeed(undefined, 10, true), { enabled: false, rows: [] }, "undefined 载荷 → 空");
        eq(formatFeed({}, 10, true), { enabled: false, rows: [] }, "空对象 → 空，enabled 默认 false");
        eq(
          formatFeed({ enabled: true, entries: [] }, 10, true),
          { enabled: true, rows: [] },
          "开着但没记录 → enabled 是 true",
        );
        eq(formatFeed({ enabled: true, entries: "nope" }, 10, true).rows, [], "entries 不是数组 → 空");

        var feed = {
          enabled: true,
          entries: [
            { at: AT, op: "say", detail: "first" },
            { at: AT + 1000, op: "act", detail: "theme.set" },
            { at: AT + 2000, op: "say", detail: "third" },
          ],
        };

        eq(
          formatFeed(feed, 10, true).rows.map(function (row) {
            return row.text;
          }),
          ["third", "changed the theme", "first"],
          "新的在前",
        );

        eq(formatFeed(feed, 2, true).rows.length, 2, "limit 生效");
        eq(formatFeed(feed, 2, true).rows[0].text, "third", "limit 砍掉的是最旧的，不是最新的");

        eq(
          formatFeed(feed, 10, false).rows.map(function (row) {
            return row.kind;
          }),
          ["say", "say"],
          "关掉 Show changes 只剩 agent 说的话",
        );
        eq(
          formatFeed({ enabled: true, entries: [{ op: "act", detail: "theme.set" }] }, 10, false).rows.length,
          0,
          "全是改动时关掉 Show changes → 空",
        );

        // limit 的边界：0 / 负数 / 非数字 / 超大都要落在合理范围里
        eq(formatFeed(feed, 0, true).rows.length, 3, "limit 0 当成没给（默认 10）");
        eq(formatFeed(feed, -5, true).rows.length, 3, "负的 limit 不会漏出全部");
        eq(formatFeed(feed, "abc", true).rows.length, 3, "非数字 limit 退回默认");
        var many = { enabled: true, entries: [] };
        for (var manyIndex = 0; manyIndex < 80; manyIndex += 1) {
          many.entries.push({ op: "say", detail: "n" + manyIndex });
        }
        eq(formatFeed(many, 999, true).rows.length, 50, "limit 上限 50，不会一次画八十行");

        // ---- 6. 混合输入 ----

        var mixed = {
          enabled: false,
          entries: [
            null,
            { op: "state" },
            { op: "say", detail: "kept" },
            { op: "act", detail: "placement.add" },
            { op: "raw", detail: "unauthorized" },
          ],
        };
        var mixedRows = formatFeed(mixed, 10, true).rows;
        eq(mixedRows.length, 2, "读操作和坏记录被跳过，剩下的都留着");
        eq(
          mixedRows.map(function (row) {
            return row.kind;
          }),
          ["act", "say"],
          "顺序仍然是从新到旧",
        );
        eq(formatFeed(mixed, 10, true).enabled, false, "端点关着也照常显示历史");

        var long = new Array(401).join("x");
        eq(
          formatFeed({ entries: [{ op: "say", detail: long }] }, 10, true).rows[0].text.length,
          400,
          "长文本不在这里截断（交给 CSS 两行封顶）",
        );

        flush();
      })();
    </script>
  </body>
</html>
