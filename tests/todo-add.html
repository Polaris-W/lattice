<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>todo add / toggle / delete test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
      iframe {
        position: absolute;
        left: -9999px;
        width: 300px;
        height: 240px;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /*
       * 这页盯的是「回车加不上」这个 bug。
       *
       * 沙箱 iframe 里少一个 allow-forms，浏览器会把整个提交过程拦掉 ——
       * submit 事件根本不触发，组件里的 onSubmit 一行都不跑，而且不报错。
       * 用 requestSubmit() 代替"敲回车"：它走的是同一条提交算法，
       * 同样会撞上沙箱检查，但不用伪造可信键盘事件。
       *
       * 场景 7 顺带钉住优先级圆点（三档 + 没设）的循环与落盘。
       */
      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function mountTodo({ forms = true, initial } = {}) {
        const state = { stored: initial, setCalls: 0 };
        const frame = document.createElement("iframe");
        // allow-same-origin 只是让测试能读 iframe 里的 DOM，
        // 被测的是 allow-forms 这一位 —— 两种沙箱都带着 allow-same-origin，变量只有一个。
        frame.setAttribute(
          "sandbox",
          "allow-scripts allow-same-origin" + (forms ? " allow-forms" : ""),
        );
        frame.src = "/widgets/lattice.todo/index.html";
        document.body.appendChild(frame);

        const ready = new Promise((resolve) => {
          window.addEventListener("message", function handler(event) {
            if (event.source !== frame.contentWindow) return;
            const data = event.data;
            if (!data || data.__lattice !== 1) return;
            if (data.type === "ready") {
              resolve();
              return;
            }
            if (data.type !== "request") return;

            const reply = (payload) =>
              frame.contentWindow.postMessage(
                Object.assign({ __lattice: 1, type: "response", id: data.id }, payload),
                "*",
              );

            if (data.method === "storage.get") {
              reply({ ok: true, result: state.stored });
              return;
            }
            if (data.method === "storage.set") {
              state.setCalls += 1;
              state.stored = data.params.value;
              reply({ ok: true, result: { ok: true } });
              return;
            }
            reply({ ok: false, error: "unknown" });
          });
        });

        return { frame, state, ready };
      }

      const texts = (doc) =>
        Array.from(doc.querySelectorAll(".todo-text")).map((el) => el.textContent);

      // ---- 场景 1：回车能加上 ----
      {
        const todo = mountTodo();
        await todo.ready;
        const doc = todo.frame.contentDocument;
        const input = doc.getElementById("input");
        const form = doc.getElementById("form");

        input.value = "Buy milk";
        form.requestSubmit();
        await sleep(120);

        log(texts(doc).join("|") === "Buy milk", `提交后列表里是「${texts(doc).join("|")}」`);
        log(
          Array.isArray(todo.state.stored) && todo.state.stored.length === 1,
          `落盘条数 ${todo.state.stored ? todo.state.stored.length : "null"}`,
        );
        log(input.value === "", "提交后输入框已清空");

        // ---- 场景 2：连加两条，最新的一条在最上面 ----
        input.value = "Read the spec";
        form.requestSubmit();
        await sleep(120);
        log(texts(doc).join("|") === "Read the spec|Buy milk", `顺序是「${texts(doc).join("|")}」`);

        // ---- 场景 3：勾掉一条，计数跟着走 ----
        log(doc.getElementById("meta").textContent === "2 left", `计数是「${doc.getElementById("meta").textContent}」`);
        doc.querySelectorAll(".todo-item")[1].querySelector(".todo-check").click();
        await sleep(120);
        log(todo.state.stored[1].done === true, `第二条的 done 落盘为 ${todo.state.stored[1].done}`);
        log(doc.getElementById("meta").textContent === "1 left", `勾掉后计数是「${doc.getElementById("meta").textContent}」`);

        // ---- 场景 4：点整行也能勾 ----
        doc.querySelectorAll(".todo-text")[0].click();
        await sleep(120);
        log(todo.state.stored[0].done === true, "点文字也能勾上");
        log(doc.getElementById("meta").textContent === "All done", `全勾完计数是「${doc.getElementById("meta").textContent}」`);

        // ---- 场景 5：删除 ----
        doc.querySelectorAll(".todo-remove")[0].click();
        await sleep(120);
        log(texts(doc).join("|") === "Buy milk", `删完剩下「${texts(doc).join("|")}」`);
        log(todo.state.stored.length === 1, `落盘条数 ${todo.state.stored.length}`);

        todo.frame.remove();
      }

      // ---- 场景 6：没有 allow-forms 时，提交被整条拦掉（这就是当初的病根） ----
      {
        const todo = mountTodo({ forms: false });
        await todo.ready;
        const doc = todo.frame.contentDocument;
        doc.getElementById("input").value = "Should not appear";
        doc.getElementById("form").requestSubmit();
        await sleep(200);

        log(
          texts(doc).length === 0 && todo.state.setCalls === 0,
          `无 allow-forms 时提交被拦（列表 ${texts(doc).length} 条，写盘 ${todo.state.setCalls} 次）`,
        );
        todo.frame.remove();
      }

      /*
       * ---- 场景 7：优先级圆点 ----
       *
       * 三档 + "没设"：点一下 红 → 黄 → 绿 → 没设。四条要钉住：
       *   1. 老数据没有这个字段，载入时不能画出个错的颜色
       *   2. 循环顺序不能乱（第一下给红，最后一下回到空心）
       *   3. 点圆点不能顺手把这条勾掉（整行都能勾，最容易串）
       *   4. 每一档都要真的落盘，不然换个实例看就没了
       */
      {
        const todo = mountTodo({
          initial: [
            { id: "a", text: "Ship it", done: false, priority: "high" },
            { id: "b", text: "Read mail", done: false },
          ],
        });
        await todo.ready;
        const doc = todo.frame.contentDocument;
        await sleep(80);

        const dots = () =>
          Array.from(doc.querySelectorAll(".todo-dot")).map((el) => el.dataset.level || "none");
        const firstDot = () => doc.querySelectorAll(".todo-dot")[0];

        log(dots().join("|") === "high|none", `载入时圆点是「${dots().join("|")}」`);

        // 屏幕阅读器只读 aria-label，它得说清"点一下会发生什么"
        const labelOf = (i) => doc.querySelectorAll(".todo-dot")[i].getAttribute("aria-label");
        log(
          labelOf(1) === "No priority. Click to set high.",
          `没设时读作「${labelOf(1)}」`,
        );

        firstDot().click();
        await sleep(120);
        log(
          dots()[0] === "med" && todo.state.stored[0].priority === "med",
          `红点一下变「${dots()[0]}」，落盘 ${todo.state.stored[0].priority}`,
        );

        doc.querySelectorAll(".todo-dot")[1].click();
        await sleep(120);
        log(dots()[1] === "high", `没设的点了变「${dots()[1]}」`);
        log(todo.state.stored[1].done === false, "点圆点不会顺手把这条勾掉");

        firstDot().click();
        await sleep(120);
        log(dots()[0] === "low", `再点变「${dots()[0]}」`);
        log(labelOf(0) === "Priority: Low. Click to clear it.", `绿色读作「${labelOf(0)}」`);

        firstDot().click();
        await sleep(120);
        log(
          dots()[0] === "none" && !("priority" in todo.state.stored[0]),
          `再点回到空心，落盘字段 ${JSON.stringify(todo.state.stored[0].priority)}`,
        );

        firstDot().click();
        await sleep(120);
        log(dots()[0] === "high", `再点回到「${dots()[0]}」`);

        todo.frame.remove();
      }

      document.getElementById("out").innerHTML = lines
        .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
        .join("\n");
      window.__done = true;
    </script>
  </body>
</html>
