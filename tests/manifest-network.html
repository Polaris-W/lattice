<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>manifest network test</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font: 12px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      .ok {
        color: #5dcaa5;
      }
      .bad {
        color: #f09595;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /*
       * 清单里的联网白名单（`network.hosts`）。
       *
       * 这一页钉的是"哪些写法能过、哪些过不去"，因为写坏一条的后果分两种，
       * 都很糟：
       *   - 该拒的放过去了 -> 白名单形同虚设
       *   - 该放的拒掉了   -> 组件连不上，但报错只说"不在白名单里"，
       *                       作者会以为是清单写错了地方
       *
       * 归一化规则（runtime/manifest.ts 的 normalizeNetwork）：
       *   - 小写、去首尾空白
       *   - 只认 `host` 和 `host:port`，**不支持通配符**
       *   - 写坏一条只丢那一条，不让整包加载失败（和图标同一个理由）
       *
       * 另外钉一下 `network` 已经算"可授权"了（PERMISSION_READY）——
       * 那是桥上有 `network.fetch` 可调的前提。
       */
      import { normalizeManifest, isPermissionReady } from "/src/runtime/manifest.ts";

      const lines = [];
      const log = (pass, text) => lines.push((pass ? "PASS " : "FAIL ") + text);
      const eq = (actual, expected, text) =>
        log(
          JSON.stringify(actual) === JSON.stringify(expected),
          `${text}（得到 ${JSON.stringify(actual)}）`,
        );

      /** 一份最小的合法清单，其余字段都靠默认值 */
      const base = { id: "lattice.clock", version: "1.0.0" };
      const hosts = (raw) => normalizeManifest({ ...base, network: raw }, "dir").network.hosts;

      // ---- 1. 没写就是空：默认哪儿都连不上 ----
      eq(normalizeManifest(base, "dir").network.hosts, [], "没声明 network -> 空列表");
      eq(hosts({}), [], "network 是空对象 -> 空列表");
      eq(hosts({ hosts: null }), [], "hosts 不是数组 -> 空列表");
      eq(hosts("example.com"), [], "network 不是对象 -> 空列表");

      // ---- 2. 正常写法 ----
      eq(hosts({ hosts: ["api.example.com"] }), ["api.example.com"], "普通域名");
      eq(hosts({ hosts: ["API.Example.COM"] }), ["api.example.com"], "统一小写");
      eq(hosts({ hosts: ["  example.com  "] }), ["example.com"], "去首尾空白");
      eq(hosts({ hosts: ["localhost"] }), ["localhost"], "单段主机名（本地服务）");
      eq(hosts({ hosts: ["127.0.0.1"] }), ["127.0.0.1"], "IP 字面量");
      eq(hosts({ hosts: ["example.com:8080"] }), ["example.com:8080"], "钉端口的写法");
      eq(hosts({ hosts: ["a-b.example.co.uk"] }), ["a-b.example.co.uk"], "多级域名 + 连字符");

      // ---- 3. 通配符必须挡掉 ----
      // `*.example.com` 的边界问题（evil.example.com.attacker.net）靠人一遍遍想
      // 不划算；多列一行的成本几乎为零
      eq(hosts({ hosts: ["*"] }), [], "裸星号被丢掉");
      eq(hosts({ hosts: ["*.example.com"] }), [], "通配子域被丢掉");
      eq(hosts({ hosts: ["example.*"] }), [], "尾巴通配被丢掉");

      // ---- 4. 写坏的只丢自己，不连累别人 ----
      eq(
        hosts({ hosts: ["", "   ", "ok.example.com", 42, null, "a b", "http://x.example.com"] }),
        ["ok.example.com"],
        "坏条目单独丢掉，好的留下",
      );
      eq(hosts({ hosts: ["example.com", "example.com"] }), ["example.com"], "重复的只留一条");
      eq(hosts({ hosts: ["example.com", "EXAMPLE.com"] }), ["example.com"], "大小写不同也算重复");

      // ---- 5. 整包不因为 network 写坏而失败 ----
      // 清单里其它字段照常归一化，只是白名单是空的
      const broken = normalizeManifest({ ...base, name: "Clock", network: 5 }, "dir");
      log(broken.name === "Clock", "network 写坏不影响其它字段");
      eq(broken.network.hosts, [], "network 写坏 -> 空白名单（而不是抛错）");

      // ---- 6. 权限已经可授权 ----
      log(isPermissionReady("network"), "network 已是可授权权限（桥上有 network.fetch）");
      // v0.4 补上了 SMTC，六项权限至此全齐 —— 这条以前断言的是"还没做"，
      // 现在反过来钉住它已经可授权（清单里声明 media:control 的组件能真的用上）
      log(isPermissionReady("media:control"), "media:control 已可授权（桥上有 media.get / media.control）");
      log(
        ["clock", "storage", "clipboard:write", "network", "system:monitor", "media:control"].every(
          (name) => isPermissionReady(name),
        ),
        "六项权限全部可授权",
      );

      document.getElementById("out").innerHTML = lines
        .map((line) => `<span class="${line.startsWith("PASS") ? "ok" : "bad"}">${line}</span>`)
        .join("\n");
      window.__done = true;
    </script>
  </body>
</html>
