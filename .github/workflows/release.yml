name: release

# 打一个 tag（`v0.2.0`）→ 在 windows-latest 上出 NSIS 安装包 + 更新包 + latest.json，
# 传成一条 **draft** release。确认无误后手动点 Publish，`releases/latest` 才会指向它。
#
# 为什么是 draft：`/releases/latest/download/latest.json` 这个地址只认已发布的
# release。draft 期间更新器查不到任何东西（等于没发），发布那一刻全量生效 ——
# 这比"发出去再后悔"好。
#
# 为什么要 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY          更新包的 minisign 私钥（`.keys/updater.key` 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 生成时设的密码；没设就留空（但那样建议别用）
# 私钥进仓库 = 任何人都能给你所有用户推假更新。它只在这台机器和这个仓库的 Secrets 里。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 全量编一次要十几分钟，缓存能砍掉大半
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 前端类型检查先过一遍：打包要跑 `npm run build`，类型错了会白等十分钟
      - run: npm run typecheck

      # 把密钥里的换行去掉再交给 tauri。
      #
      # GitHub 的 Secret 文本框会原样保存粘贴进来的内容：`cat .keys/updater.key | clip`
      # 复制过去时末尾那个换行也在，而 tauri 的 base64 解码器不认它 —— 报
      # `failed to decode base64 key: Invalid symbol 10, offset 348`（10 就是 `\n`，
      # 348 正好是这把钥匙的长度）。第一次发版就栽在这里：编译 3 分 54 秒、
      # NSIS 都打出来了，最后签名这一步红掉。
      #
      # 这一步只是清洗，不改密钥本身；顺手把"空密钥"变成一条能看懂的报错。
      - name: Normalize the signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "signing key: ${#KEY} characters"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 密钥来自上一步写进 GITHUB_ENV 的那份（已去掉换行）。
          # **不要**在这里再写一次 `secrets.TAURI_SIGNING_PRIVATE_KEY` ——
          # 步骤级 env 会盖掉 GITHUB_ENV，等于把换行又塞回去了
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lattice ${{ github.ref_name }}
          releaseBody: |
            安装包在下面。已经装过旧版本的，可以在设置菜单里点 **Check for updates** 直接升级。

            这个版本包含什么、修了什么，看仓库的提交记录。
          # 先出草稿，人工过一眼再发布
          releaseDraft: true
          prerelease: false
