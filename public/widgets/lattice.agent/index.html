<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      结构只有三段：一行表头（名字 + 状态）、一列记录、一句占位。

      "Loading…" 写在 HTML 里而不是等桥回来再写：`agent.activity` 最长 3 秒，
      等它的话卡片会先空 3 秒。占位文案在拿到第一次回话之后才换成
      "Nothing yet." —— 加载中就说"什么都没有"是在撒谎。
    -->
    <main class="feed">
      <header class="feed-head">
        <span class="feed-title">Agent</span>
        <span class="feed-state" id="state"></span>
      </header>
      <ol class="feed-list" id="list"></ol>
      <p class="feed-empty" id="empty">Loading…</p>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
