<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="cd">
      <div class="cd-label" id="label">Loading…</div>
      <div class="cd-days"><span id="days">--</span><small>days</small></div>
      <div class="cd-clock" id="clock">--:--:--</div>
      <label class="cd-pick">
        <span>Target date</span>
        <input type="date" id="target" />
      </label>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
