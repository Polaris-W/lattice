<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Now Playing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="mp">
      <header class="mp-head">
        <h1 class="mp-title">Now playing</h1>
      </header>

      <section class="mp-track">
        <p class="mp-name" id="track">Nothing playing</p>
        <p class="mp-sub">
          <span class="mp-artist" id="artist"></span>
          <span class="mp-source" id="source"></span>
        </p>
      </section>

      <section class="mp-progress" id="progress">
        <div class="mp-bar"><i id="bar"></i></div>
        <div class="mp-times">
          <span id="position">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </section>

      <footer class="mp-controls">
        <button type="button" class="mp-btn" id="prev" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.4 3.4v9.2" />
            <path d="M12.4 3.6 6.2 8l6.2 4.4z" fill="currentColor" />
          </svg>
        </button>
        <button type="button" class="mp-btn is-main" id="toggle" title="Play / pause" aria-label="Play or pause">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" id="toggle-glyph">
            <path d="M5 3.2 12.4 8 5 12.8z" />
          </svg>
        </button>
        <button type="button" class="mp-btn" id="next" title="Next" aria-label="Next">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11.6 3.4v9.2" />
            <path d="M3.6 3.6 9.8 8l-6.2 4.4z" fill="currentColor" />
          </svg>
        </button>
      </footer>

      <p class="mp-hint" id="hint"></p>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
