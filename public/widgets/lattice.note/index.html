<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Note</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="note">
      <div class="note-head">
        <span id="status">Loading…</span>
      </div>
      <textarea id="text" placeholder="Write something…" spellcheck="false"></textarea>
      <footer class="note-foot">
        <span id="count">0 chars</span>
      </footer>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
