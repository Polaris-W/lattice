<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>待办清单</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo">
      <form class="todo-form" id="form">
        <input
          class="todo-input"
          id="input"
          type="text"
          placeholder="添加待办，回车确认"
          autocomplete="off"
          maxlength="120"
        />
      </form>
      <div class="todo-body">
        <ul class="todo-list" id="list"></ul>
        <p class="todo-empty" id="empty">还没有待办</p>
      </div>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
